nodeDownloadMirrors:
  release: "https://npmmirror.com/mirrors/node/"
  rc: "https://npmmirror.com/mirrors/node-rc/"
  nightly: "https://npmmirror.com/mirrors/node-nightly/"
allowBuilds:
  "@nestjs/core": true
  "@scarf/scarf": true
  "core-js": true
  "esbuild": true
  "protobufjs": true
registry: "https://registry.npmjs.org"
resolvePeersFromWorkspaceRoot: true
sharedWorkspaceLockfile: false
overrides:
  # Native TS 7 emits declarations directly; omit the unused optional declaration bundler.
  '@rslib/core>@microsoft/api-extractor': '-'
  'rsbuild-plugin-dts>@microsoft/api-extractor': '-'
  # Match rehype-katex's renderer to the application's KaTeX stylesheet.
  'rehype-katex>katex': ^0.19.0
  'micromark-extension-math>katex': ^0.19.0
  'monaco-editor>dompurify': ^3.4.17
  # ExcelJS's only Node UUID call is patched to crypto.randomUUID.
  'exceljs>uuid': '-'
  '@nestjs/cli>webpack': '-'
  '@nestjs/cli>ts-loader': '-'
  '@nestjs/cli>fork-ts-checker-webpack-plugin': '-'
strictPeerDependencies: false
# Packages have separate lockfiles; most do not depend on ExcelJS.
allowUnusedPatches: true
patchedDependencies:
  exceljs@4.4.0: patches/exceljs@4.4.0.patch
